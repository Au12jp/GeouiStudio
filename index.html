/* --- プレビューを画像・動画で保存 ----------------------------------------- */
const Capture = (() => {
  function still() {
    const cv = $("#pv");
    if (!cv) return;
    cv.toBlob((blob) => {
      if (!blob) { Log.warn("画像にできませんでした"); return; }
      blob.arrayBuffer().then(b => {
        download(new Uint8Array(b), (app.meta.name || "geoui") + "_" + app.time.toFixed(2) + "s.png");
        Log.ok("いまの 1 コマを画像で保存しました");
      });
    }, "image/png");
  }
  async function movie() {
    const cv = $("#pv");
    if (!cv || !cv.captureStream || typeof MediaRecorder === "undefined") {
      Log.warn("このブラウザでは動画の保存に対応していません。画像での保存をお使いください");
      return;
    }
    const ok = await Dialog.confirm("プレビューを動画で保存",
      `最初から最後まで（${DUR().toFixed(2)} 秒）を録画します。録画中は再生が始まります。`, "録画する");
    if (!ok) return;
    let rec, chunks = [];
    try {
      const stream = cv.captureStream(30);
      const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
        .find(m => MediaRecorder.isTypeSupported(m)) || "";
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    } catch (e) { Log.warn("録画を始められませんでした"); return; }
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const pg = Dialog.progress("録画しています");
    const done = new Promise((res) => { rec.onstop = res; });
    rec.start();
    app.time = 0; app.playing = true; app.lastT = performance.now();
    Stage.renderTransport();
    const t0 = performance.now(), total = DUR() * 1000;
    await new Promise((res) => {
      const tick = () => {
        const el = performance.now() - t0;
        pg.set(Math.min(1, el / total), `${(el / 1000).toFixed(1)} / ${DUR().toFixed(1)} 秒`);
        if (el >= total + 60) res(); else requestAnimationFrame(tick);
      };
      tick();
    });
    app.playing = false; Stage.renderTransport();
    rec.stop();
    await done;
    pg.done();
    const blob = new Blob(chunks, { type: "video/webm" });
    const buf = new Uint8Array(await blob.arrayBuffer());
    download(buf, (app.meta.name || "geoui") + ".webm");
    Log.ok(`動画で保存しました（${(buf.length / 1048576).toFixed(1)} MB）`);
  }
  return { still, movie };
})();

const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(s); };
const unb64 = (s) => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
function download(bytes, filename) {
  const blob = new Blob([bytes], { type: "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function ipcSource() {
  const bin = atob(IPC_SRC_B64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}

/* ============================================================================
   Safe — 外から来たデータ（プロジェクト・モデル・自動保存）を安全に扱う
   ・__proto__ などの危険なキーを落とす（プロトタイプ汚染よけ）
   ・深さ・要素数を制限して、壊れた／悪意のあるファイルで固まらないようにする
   ・数値・文字列を想定内の範囲に丸める
   ========================================================================== */
const Safe = (() => {
  const BAD = { __proto__: 1, constructor: 1, prototype: 1 };
  const MAX_DEPTH = 24, MAX_KEYS = 4000, MAX_ARR = 200000, MAX_STR = 2000000;

  /** JSON 由来のオブジェクトを、素性のわかる素の値だけに作り直す */
  function obj(v, depth) {
    depth = depth || 0;
    if (depth > MAX_DEPTH) return null;
    if (v === null || v === undefined) return v;
    const t = typeof v;
    if (t === "number") return Number.isFinite(v) ? v : 0;
    if (t === "boolean") return v;
    if (t === "string") return v.length > MAX_STR ? v.slice(0, MAX_STR) : v;
    if (t !== "object") return null;                 /* 関数などは捨てる */
    if (Array.isArray(v)) {
      const out = [];
      const n = Math.min(v.length, MAX_ARR);
      for (let i = 0; i < n; i++) out.push(obj(v[i], depth + 1));
      return out;
    }
    const out = Object.create(null), src = Object.keys(v);
    const n = Math.min(src.length, MAX_KEYS);
    const plain = {};
    for (let i = 0; i < n; i++) {
      const k = src[i];
      if (BAD[k] || k === "__proto__") continue;
      plain[k] = obj(v[k], depth + 1);
    }
    return plain;
  }
  /** 文字列 → JSON（失敗しても例外を投げず null を返す） */
  function json(text, limit) {
    try {
      if (typeof text !== "string") return null;
      if (limit && text.length > limit) return null;
      return obj(JSON.parse(text));
    } catch (e) { return null; }
  }
  /** 数値を範囲に収める（NaN・Infinity・文字列も安全に） */
  const num = (v, min, max, fb) => {
    const n = +v;
    if (!Number.isFinite(n)) return fb;
    return n < min ? min : n > max ? max : n;
  };
  /** 名前空間：Minecraft で使える形（英小文字で始まる a-z0-9_）に直す */
  function ns(s) {
    let v = String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9_]/g, "_").replace(/^_+|_+$/g, "");
    if (!v) v = "geoui";
    if (!/^[a-z]/.test(v)) v = "g" + v;
    if (v === "minecraft") v = "geoui";
    return v.slice(0, 24);
  }
  /** ファイル名として安全な文字だけにする */
  const file = (s, fb) => (String(s == null ? "" : s)
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/\.+$/, "").trim() || fb || "geoui").slice(0, 80);
  return { obj, json, num, ns, file };
})();

const Project = (() => {
  /** 非破壊：レシピ（デザイン・エフェクトの設定）は必ず残す */
  function serialize(withMedia) {
    const d = {
      v: 6, meta: app.meta, screen: app.screen, timing: app.timing, triggers: app.triggers,
      build: app.build, onEndCommands: app.onEndCommands, maxDim: app.maxDim,
      scenes: app.scenes, startScene: app.startScene, device: app.device, pro: app.pro,
      tlWork: app.tlWork || null, tlMarks: app.tlMarks || [],
      tlSnap: app.tlSnap !== false, tlRipple: !!app.tlRipple, tlGraph: !!app.tlGraph,
      layers: []
    };
    for (const L of app.layers) {
      const o = Object.assign({}, L);
      delete o.src; delete o.audio; delete o.model;
      if (withMedia && L.src) {
        o._src = {
          pages: L.src.pages.map(cv => cv.toDataURL("image/png")),
          plan: L.src.plan, frames: L.src.frames, frameW: L.src.frameW, frameH: L.src.frameH,
          fps: L.src.fps, mediaAspect: L.src.mediaAspect
        };
      }
      if (withMedia && L.audio) o._audio = { b64: b64(L.audio.bytes), duration: L.audio.duration, ext: L.audio.ext };
      if (L.model && !L.model.generated) o._model = {
        geoRaw: L.model.geoRaw, animRaw: L.model.animRaw, animList: L.model.animList,
        tex: L.model.textureBytes ? b64(L.model.textureBytes) : null
      };
      d.layers.push(o);
    }
    return d;
  }
  async function restore(d) {
    d = Safe.obj(d) || {};
    if (!Array.isArray(d.layers)) d.layers = [];
    if (!Array.isArray(d.scenes)) d.scenes = [];
    Object.assign(app.meta, d.meta || {});
    app.meta.ns = Safe.ns(app.meta.ns);
    app.meta.name = String(app.meta.name == null ? "" : app.meta.name).slice(0, 120);
    Object.assign(app.screen, d.screen || {});
    if (!(+app.screen.uiPxPerUnit > 0)) app.screen.uiPxPerUnit = 1.364;
    if (!(+app.screen.unitsPerScreenH > 0)) app.screen.unitsPerScreenH = 176;
    /* v6 で画面の基準を実測値(×20.25)に入れ替えた。古い保存データはここで引き上げる */
    const oldH = +app.screen.unitsPerScreenH;
    const needMigrate = (+d.v || 0) < 6 && oldH < 60;
    if (needMigrate) {
      app.screen.unitsPerScreenH = rnd(oldH * 20.25, 2);
      app.screen.uiPxPerUnit = rnd(240 / app.screen.unitsPerScreenH, 4);
    }
    Object.assign(app.timing, d.timing || {});
    Object.assign(app.triggers, d.triggers || {});
    Object.assign(app.build, d.build || {});
    app.onEndCommands = d.onEndCommands || [];
    app.maxDim = d.maxDim || 2048;
    app.scenes = d.scenes || [];
    app.startScene = d.startScene == null ? -1 : d.startScene;
    app.pro = !!d.pro;
    if (d.device) { app.device = d.device; app.previewAspect = dev().aspect; }
    app.tlWork = d.tlWork || null;
    app.tlMarks = Array.isArray(d.tlMarks) ? d.tlMarks : [];
    app.tlSnap = d.tlSnap !== false;
    app.tlRipple = !!d.tlRipple;
    app.tlGraph = !!d.tlGraph;
    app.layers = [];
    for (const o of (d.layers || [])) {
      const L = ensureKeys(Object.assign(newLayer(o.type), o));
      delete L._src; delete L._audio; delete L._model;
      if (o._src) {
        const pages = [];
        for (const url of o._src.pages) {
          const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
          if (!img) continue;
          const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height;
          cv.getContext("2d").drawImage(img, 0, 0);
          pages.push(cv);
        }
        L.src = Object.assign({}, o._src, { pages });
      }
      if (o._audio) L.audio = { bytes: unb64(o._audio.b64), duration: o._audio.duration, ext: o._audio.ext };
      if (o._model) L.model = { geoRaw: o._model.geoRaw, animRaw: o._model.animRaw, animList: o._model.animList,
        textureBytes: o._model.tex ? unb64(o._model.tex) : null };
      /* レシピからの再生成（非破壊編集の要） */
      if (L.fx && L.fx.model && ModelFx.table[L.fx.id]) {
        const r = ModelFx.bake(L.fx.id, L.fx.p);
        L.model = r.model; ModelFx.syncBox(L);
      } else if (!L.src && L.design) {
        const B = await Design.bake(L.design);

function drawTemplateThumb(cv, t) {
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#0B0E13"; ctx.fillRect(0, 0, W, H);
  const keepLayers = app.layers, keepScenes = app.scenes, keepStart = app.startScene, keepDur = app.timing.duration;
  const keepPrev = app.previewScene, keepSel = app.sel, keepTime = app.time;
  try {
    app.layers = []; app.scenes = []; app.previewScene = -1; app.sel = null; app.time = 1.2;
    const made = t.build() || [];
    for (const L of made) { ensureKeys(L); app.layers.push(L); }
    const ppu = H / Math.max(1, app.screen.unitsPerScreenH);
    for (const L of app.layers) {
      if (!Stage.visible(L)) continue;
      const lm = Object.assign({}, L, { mediaAspect: Media.aspect(L) });
      const size = GGen.baseSize(lm, app.screen);
      const [fx, fy] = GGen.fitScaleJS(lm, 16 / 9);
      const ao = GGen.anchorJS(L, app.screen, size, 16 / 9);
      const tt = Math.max(0, app.time - (L.startTime || 0));
      const ks = keyAt(L.keys.scale, 1, tt);
      const w = size.w * ppu * fx * ks, h = size.h * ppu * fy * ks;
      const cx = W / 2 + (keyAt(L.keys.x, L.x, tt) + ao.x) * ppu;
      const cy = H / 2 - (keyAt(L.keys.y, L.y, tt) + ao.y) * ppu;
      ctx.save();
      ctx.globalAlpha = clamp(keyAt(L.keys.opacity, L.opacity == null ? 1 : L.opacity, tt), 0, 1);
      ctx.translate(cx, cy);
      if (L.model && L.model.els) ModelFx.drawEls(ctx, L, tt, ppu * (L.modelScale || 1));
      else if (L.src) {
        const s = L.src;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(s.pages[0], 0, 0, s.frameW, s.frameH, -w / 2, -h / 2, w, h);
      }
      ctx.restore();
    }
  } finally {
    app.layers = keepLayers; app.scenes = keepScenes; app.startScene = keepStart;
    app.timing.duration = keepDur; app.previewScene = keepPrev; app.sel = keepSel; app.time = keepTime;
  }
}

function stripRuntime(L) {
  const o = Object.assign({}, L);
  delete o.src; delete o.model; delete o.audio; delete o.text; delete o.shape; delete o.digitStyle; delete o.design;
  const scored = app.layers.filter(x => x.scoreObjective);
  o.scoreProp = L.scoreObjective ? `${app.meta.ns}:v${clamp(scored.findIndex(x => x.id === L.id), 0, 3)}` : "";

}

  const img = c.getImageData(0, 0, 8, 8);

}

  c.fillStyle = "rgba(0,0,0,.35)"; c.fillRect(0, 168, 256, 88);
  const first = app.layers.find(l => l.src && l.type !== "audio");
  if (first) { c.imageSmoothingEnabled = false; c.drawImage(first.src.pages[0], 0, 0, first.src.frameW, first.src.frameH, 16, 34, 224, 126); }
  c.fillStyle = "#fff"; c.font = "bold 26px sans-serif"; c.textAlign = "center";
  c.fillText(String(name).slice(0, 12), 128, 216);

  return GBin.encodePNG(new Uint8Array(img.data.buffer), 256, 256, { mode: "rgba" });
}

/* ============================================================================
   GeoUI Studio — .mcworld 書き出し
   パックを入れた「そのまま遊べるワールド」を作る。
   level.dat は Bedrock 形式（8バイトのヘッダ＋リトルエンディアン NBT）。
   ========================================================================== */
const NBT = (() => {
  /** リトルエンディアンで NBT を書く小さなライター */
  function Writer() {
    let buf = new Uint8Array(1024), len = 0;
    const need = (n) => {
      if (len + n <= buf.length) return;
      let cap = buf.length;
      while (cap < len + n) cap *= 2;
      const nb = new Uint8Array(cap); nb.set(buf.subarray(0, len)); buf = nb;
    };
    const dv = () => new DataView(buf.buffer);
    return {
      u8(v) { need(1); buf[len++] = v & 255; },
      i16(v) { need(2); dv().setInt16(len, v, true); len += 2; },
      i32(v) { need(4); dv().setInt32(len, v, true); len += 4; },
      i64(v) { need(8); dv().setBigInt64(len, BigInt(v), true); len += 8; },
      f32(v) { need(4); dv().setFloat32(len, v, true); len += 4; },
      f64(v) { need(8); dv().setFloat64(len, v, true); len += 8; },
      str(sv) {
        const b = new TextEncoder().encode(sv);
        this.i16(b.length); need(b.length); buf.set(b, len); len += b.length;
      },
      done() { return buf.slice(0, len); }
    };
  }
  const TAG = { end: 0, byte: 1, short: 2, int: 3, long: 4, float: 5, double: 6,
                byteArray: 7, string: 8, list: 9, compound: 10 };
  function writeValue(w, v) {
    switch (v.t) {
      case "byte": w.u8(v.v); break;
      case "short": w.i16(v.v); break;
      case "int": w.i32(v.v); break;
      case "long": w.i64(v.v); break;
      case "float": w.f32(v.v); break;
      case "double": w.f64(v.v); break;
      case "string": w.str(v.v); break;
      case "list":
        w.u8(TAG[v.of]); w.i32(v.v.length);
        for (const it of v.v) writeValue(w, { t: v.of, v: it });
        break;
      case "compound":
        for (const k in v.v) { w.u8(TAG[v.v[k].t]); w.str(k); writeValue(w, v.v[k]); }
        w.u8(0);
        break;
    }
  }
  function levelDat(root) {
    const w = Writer();
    w.u8(TAG.compound); w.str(""); writeValue(w, { t: "compound", v: root });
    const body = w.done();
    const out = new Uint8Array(8 + body.length);
    new DataView(out.buffer).setInt32(0, 8, true);            /* ストレージ版 */
    new DataView(out.buffer).setInt32(4, body.length, true);  /* 中身の長さ */
    out.set(body, 8);
    return out;
  }
  return { levelDat, TAG };
})();

const nb = {
  b: (v) => ({ t: "byte", v: v ? 1 : 0 }),

  l: (v) => ({ t: "long", v }),
  s: (v) => ({ t: "string", v: String(v) }),

    StorageVersion: nb.i(8),
    NetworkVersion: nb.i(686),
    lastOpenedWithVersion: { t: "list", of: "int", v: [1, 21, 100, 0, 0] },
    MinimumCompatibleClientVersion: { t: "list", of: "int", v: [1, 21, 100, 0, 0] },
    InventoryVersion: nb.s("1.21.100"),
    RandomSeed: nb.l(seed),
    SpawnX: nb.i(0), SpawnY: nb.i(64), SpawnZ: nb.i(0),
    LimitedWorldOriginX: nb.i(0), LimitedWorldOriginY: nb.i(64), LimitedWorldOriginZ: nb.i(0),
    Time: nb.l(1000), currentTick: nb.l(0), DayCycleStopTime: nb.l(6000),
    commandsEnabled: nb.b(true), commandblockoutput: nb.b(true), CenterMapsToOrigin: nb.b(false),
    ConfirmedPlatformLockedContent: nb.b(false), MultiplayerGame: nb.b(true),
    LANBroadcast: nb.b(true), LANBroadcastIntent: nb.b(true),
    XBLBroadcastIntent: nb.i(3), PlatformBroadcastIntent: nb.i(3),
    bonusChestEnabled: nb.b(false), bonusChestSpawned: nb.b(true),
    daylightCycle: nb.i(1), doDaylightCycle: nb.b(false), doWeatherCycle: nb.b(false),
    doMobSpawning: nb.b(false), doFireTick: nb.b(false), mobGriefing: nb.b(false),
    keepInventory: nb.b(true), pvp: nb.b(true), showcoordinates: nb.b(true),
    naturalRegeneration: nb.b(true), tntexplodes: nb.b(true), sendcommandfeedback: nb.b(true),
    educationFeaturesEnabled: nb.b(false), immutableWorld: nb.b(false),
    spawnMobs: nb.b(false), startWithMapEnabled: nb.b(false), texturePacksRequired: nb.b(true),
    hasBeenLoadedInCreative: nb.b(true), isFromLockedTemplate: nb.b(false),
    isFromWorldTemplate: nb.b(false), isSingleUseWorld: nb.b(false), isWorldTemplateOptionLocked: nb.b(false),
    useMsaGamertagsOnly: nb.b(false), serverChunkTickRange: nb.i(4),
    randomtickspeed: nb.i(1), functioncommandlimit: nb.i(10000), maxcommandchainlength: nb.i(65535),
    spawnradius: nb.i(5), rainLevel: nb.f(0), lightningLevel: nb.f(0),
    experiments: { t: "compound", v: { experiments_ever_used: nb.b(false), saved_with_toggled_experiments: nb.b(false) } },
    world_policies: { t: "compound", v: {} },
    FlatWorldLayers: nb.s(JSON.stringify({
      biome_id: 1, block_layers: [
        { block_name: "minecraft:bedrock", count: 1 },
        { block_name: "minecraft:dirt", count: 2 },
        { block_name: "minecraft:grass_block", count: 1 }
      ], encoding_version: 6, structure_options: null
    }))
  };
  return [
    { path: "level.dat", bytes: NBT.levelDat(lvl), store: true },
    { path: "levelname.txt", text: name },
    { path: "world_resource_packs.json", text: JSON.stringify(packs.rp, null, 2) },

}

  /** よく使う置き方をワンタップで */
  function quickPlace(kind) {
    const L = Sel.list().filter(x => x.type !== "audio");
    if (!L.length) { Log.warn("編集したいものを選んでください"); return; }
    const pad = rnd((+app.screen.unitsPerScreenH || 176) * .02, 2);
    Store.commit("quickPlace", () => {
      for (const la of L) {
        if (kind === "full") { la.fit = "cover"; la.anchor = "center"; la.x = 0; la.y = 0; }
        else if (kind === "half" || kind === "third") {
          la.fit = "custom"; la.widthPct = null;
          la.heightPct = kind === "half" ? 50 : 33;
        } else {
          la.fit = la.fit === "custom" ? "custom" : "custom";
          la.padX = pad; la.padY = pad; la.x = 0; la.y = 0;
          la.anchor = { tl: "top_left", tr: "top_right", bl: "bottom_left",
                        br: "bottom_right", mid: "center" }[kind] || "center";
          if (kind === "mid") { la.padX = 0; la.padY = 0; }
        }
        if (la.model && la.model.generated) ModelFx.syncBox(la);
      }
    });
    Log.ok("配置しました");
  }

  /* ------------------------------------------------------------- shortcuts */
  function initKeys() {
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
      if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); doRedo(); return; }
      if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); Project.save(); return; }
      if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); Project.open(); return; }
      if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); Palette.open(); return; }
      if (mod && e.key.toLowerCase() === "e") { e.preventDefault(); Check.dialog(); return; }
      if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); run("dup"); return; }
      if (mod && e.key.toLowerCase() === "a" && !typing) { e.preventDefault(); Sel.all(); return; }
      if (mod && e.key.toLowerCase() === "c" && !typing) {
        e.preventDefault();
        if (!Timeline.copyKeys()) run("copyLayer");
        return;
      }
      if (mod && e.key.toLowerCase() === "v" && !typing) {
        e.preventDefault();
        if ((app.keyClip || []).length && Timeline.selected().length !== 0) { Timeline.pasteKeys(); return; }
        if ((app.keyClip || []).length && app.rtab === "motion") { Timeline.pasteKeys(); return; }
        if (app.layerClip) run("pasteLayer");
        return;
      }
      if (typing || Dialog.depth() || Design.isOpen()) return;
      if (e.key === " ") { e.preventDefault(); Stage.togglePlay(); return; }
      if (e.key === "Delete" || e.key === "Backspace") {
        if (Timeline.deleteSelected()) { e.preventDefault(); return; }
        if (e.key === "Delete") { const L = selLayer(); if (L) run("del"); }
        return;
      }
      /* 映像編集でおなじみの割り当て。
           I / O … 作業範囲の始まり・終わり     M … 目印
           , / . … ひとつ前・次の切れ目へ        Alt+, / Alt+. … 1 コマずつ  */
      if (!e.ctrlKey && !e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === "i" || k === "o") {
          const D = DUR(), t = Timeline.snap(app.time || 0);
          const w = Timeline.work() || [0, D];
          Store.commit("tl:work", () => {
            app.tlWork = k === "i" ? [Math.min(t, w[1] - .05), w[1]] : [w[0], Math.max(t, w[0] + .05)];
          }, { render: ["timeline"] });
          e.preventDefault(); return;
        }
        if (k === "m") { Timeline.addMarker(app.time || 0); toast("目印を置きました"); e.preventDefault(); return; }
        if (e.key === "," || e.key === ".") {
          const dir = e.key === "." ? 1 : -1;
          if (e.altKey) Stage.seek(clamp((app.time || 0) + dir / Timeline.FPS(), 0, DUR()));
          else Timeline.gotoEdge(dir);
          e.preventDefault(); return;
        }
      }
      if (e.key === "Escape") { Timeline.clearSel(); Menu.hide(); return; }
      if (e.key === "Home") { app.playing = false; Stage.seek(0); Stage.renderTransport(); return; }
      if (e.key === ",") { Stage.jumpKey(-1); return; }
      if (e.key === ".") { Stage.jumpKey(1); return; }
      if (e.key === "?") { Panels.shortcuts(); return; }
      if (e.key === "+" || e.key === "=") { Stage.zoom(1.25); return; }
      if (e.key === "-") { Stage.zoom(.8); return; }
      if (e.key === "0") { Stage.zoomFit(); return; }
      if (e.key === "l" || e.key === "L") { loopDialog(); return; }
      if (e.key === "s" || e.key === "S") { run(app.solo ? "soloOff" : "solo"); return; }
      if (e.key === "m" || e.key === "M") { Marks.add(); return; }
      if (e.key === "Escape") { Menu.hide(); return; }
      if (Timeline.selected().length && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        e.preventDefault();
        Timeline.nudgeSelected((e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? .5 : .05));
        return;
      }
      const sel = Sel.list();
      if (sel.length && /^Arrow/.test(e.key)) {
        e.preventDefault();
        const d = e.shiftKey ? 1 : .2;
        const dx = e.key === "ArrowLeft" ? -d : e.key === "ArrowRight" ? d : 0;
        const dy = e.key === "ArrowUp" ? d : e.key === "ArrowDown" ? -d : 0;
        Store.commit("nudge", () => {
          for (const L of sel) {
            if (L.locked) continue;
            if (dx) { const v = rnd(Anim.value(L, "x") + dx, 2); if (!Anim.autoKey(L, "x", v)) L.x = v; }
            if (dy) { const v = rnd(Anim.value(L, "y") + dy, 2); if (!Anim.autoKey(L, "y", v)) L.y = v; }
          }
        }, { coalesce: true, render: ["stage", "inspector"] });
      }
    });
  }

  /* ------------------------------------------------------- drag & drop etc */
  async function handleFile(f) {
    const n = f.name.toLowerCase(), t = f.type || "";
    if (/\.geoui\.json$/.test(n)) return Project.openFile(f);
    if (Design.isOpen()) {
      if (/^image\//.test(t) || /\.(png|jpg|jpeg|webp|gif)$/.test(n)) { await Design.addImageFile(f); Log.info("画像をボードに置きました"); }
      else Log.warn("デザインには画像を置けます");
      return;
    }
    let kind = null;
    if (t.startsWith("video/") || /\.(mp4|webm|mov|m4v|gif)$/.test(n)) kind = "video";
    else if (t.startsWith("image/") || /\.(png|jpg|jpeg|webp|bmp)$/.test(n)) kind = "image";
    else if (t.startsWith("audio/") || /\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n)) kind = "audio";
    else if (/\.json$/.test(n)) kind = "model";
    if (!kind) { Log.warn(`${f.name} は扱えない形式です`); return; }
    const L = newLayer(kind);
    addLayer(L, { quiet: true });
    if (kind === "video") await Media.importVideo(L, f);
    if (kind === "image") await Media.importImage(L, f);
    if (kind === "audio") await Media.importAudio(L, f);
    if (kind === "model") await Media.importModel(L, f);
  }
  function initDnD() {
    let depth = 0;
    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; document.body.style.outline = "3px solid var(--brand)"; document.body.style.outlineOffset = "-3px"; });
    document.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.style.outline = ""; } });
    document.addEventListener("drop", async (e) => {
      e.preventDefault(); depth = 0; document.body.style.outline = "";
      for (const f of e.dataTransfer.files) await handleFile(f);
    });
    window.addEventListener("paste", async (e) => {
      const items = [...(e.clipboardData ? e.clipboardData.items : [])];
      const f = items.map(i => i.kind === "file" ? i.getAsFile() : null).find(x => x && /^image\//.test(x.type));
      if (!f) return;
      e.preventDefault();
      if (Design.isOpen()) { await Design.addImageFile(f); Log.info("貼り付けた画像を置きました"); }
      else { const L = newLayer("image", "貼り付けた画像"); addLayer(L, { quiet: true }); await Media.importImage(L, f); }
    });
  }

    /* render jobs */
    Render.on("layers", () => Panels.layers());
    Render.on("inspector", () => Panels.inspector());

    UI.init(); Stage.initDrag(); Stage.initBars(); Stage.initZoom();
    Timeline.init(); Design.init(); Tools.initLayerDnD(); Tools.initContextMenus();
    i18nWatch();                      /* 日本語 / English の入れ替え */
    initKeys(); initDnD();

    setIcon("#btnUndo", "undo"); setIcon("#btnRedo", "redo"); setIcon("#btnHelp", "help"); setIcon("#mMenu", "menu");
    $("#btnUndo").onclick = doUndo;
    $("#btnRedo").onclick = doRedo;
    $("#btnHelp").onclick = helpDialog;
    const cmdBtn = $("#btnCmd");
    if (cmdBtn) { cmdBtn.innerHTML = icon("wand"); cmdBtn.onclick = () => Palette.open(); }
    initStageGrip();
    $("#btnTheme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    $("#btnExport").onclick = () => Check.dialog();
    $("#mMenu").onclick = (e) => Menu.show(e.currentTarget, [
      ...menuItems("file").slice(0, 5), { sep: 1 }, ...menuItems("view").slice(0, 1),
      { id: "pro2", label: (app.pro ? "✓ " : "") + "くわしい設定", run: () => { app.pro = !app.pro; invalidate("inspector"); } },
      { id: "help2", label: "使い方", icon: "help", run: helpDialog }
    ]);
    $$(".menubar button").forEach(b => b.onclick = () => Menu.show(b, menuItems(b.dataset.menu)));

    $("#projName").addEventListener("input", (e) => {
      app.meta.name = e.target.value;
      Store.markDirty();
    });

    $$("#leftTabs button").forEach(b => b.onclick = () => { app.ltab = b.dataset.ltab; setView(app.ltab === "scenes" ? "scenes" : "layers"); });
    $$("#inspTabs button").forEach(b => b.onclick = () => setView(b.dataset.rtab));

    $("#mobileNav").innerHTML = [
      ["layers", "レイヤー", "layers"], ["inspect", "設定", "settings"],
      ["motion", "動き", "bolt"], ["export", "書き出し", "download"]
    ].map(([v, l, ic]) => `<button data-view="${v}" aria-selected="${app.view === v}">${icon(ic)}${l}</button>`).join("") +
      `<button data-act="design">${icon("palette")}デザイン</button>`;
    $("#mobileNav").addEventListener("click", (e) => {
      const b = e.target.closest("[data-view]");
      if (b) return setView(b.dataset.view);
      const a = e.target.closest("[data-act]");
      if (a) run(a.dataset.act, e, a);
    });

    /* delegated actions */
    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-act]");
      if (a && !e.target.closest("#mobileNav")) { run(a.dataset.act, e, a); return; }
      const lay = e.target.closest("[data-layer]");
      if (lay) {
        const vis = e.target.closest("[data-vis]");
        if (vis) {
          const L = app.layers.find(x => x.id === vis.dataset.vis);
          if (L) Store.commit("layer:visible", () => L.enabled = !L.enabled, { render: ["layers", "stage", "timeline"] });
          return;
        }
        const id = lay.dataset.layer;
        if (e.shiftKey) Sel.range(id);
        else if (e.ctrlKey || e.metaKey) Sel.toggle(id);
        else { Sel.only(id); if (isTouch()) setView("inspect"); }
        return;
      }
      const qk = e.target.closest("[data-quick]");
      if (qk) { quickPlace(qk.dataset.quick); return; }
      const al = e.target.closest("[data-align]");
      if (al) { Sel.align(al.dataset.align); return; }
      const di = e.target.closest("[data-dist]");
      if (di) { Sel.distribute(di.dataset.dist); return; }
      const sc = e.target.closest("[data-scene]");
      if (sc) { const i = +sc.dataset.scene; Store.set(() => app.previewScene = app.previewScene === i ? -1 : i, ["layers", "stage", "status"]); return; }
      const pr = e.target.closest("[data-preset]");
      if (pr) { const p = Anim.PRESETS.find(x => x.id === pr.dataset.preset); if (p) Anim.apply(p); return; }
      const tg = e.target.closest("[data-togch]");
      if (tg) { Anim.toggleChannel(tg.dataset.togch); return; }
      const ez = e.target.closest("[data-ez]");
      if (ez) {
        const list = Timeline.selected();
        if (!list.length && !app.selKey) return;
        Store.commit("easing", () => {
          if (list.length) for (const s2 of list) s2.k.e = ez.dataset.ez;
          else app.selKey.k.e = ez.dataset.ez;
        });
        if (list.length > 1) Log.ok(`${list.length} 個のキーに適用しました`);
        return;
      }
      const gp = e.target.closest("[data-grp]");
      if (gp) {
        app.anim.group = gp.dataset.grp;
        if (gp.dataset.grp === "out") app.anim.at = rnd(Math.max(0, DUR() - app.anim.dur), 2);
        if (gp.dataset.grp === "in") app.anim.at = 0;
        invalidate("inspector"); return;
      }
      const fq = e.target.closest("[data-fxq] [data-q]");
      if (fq) {
        const L = selLayer();
        if (L && L.fx) { Store.commit("fx:quality", () => L.fx.q = fq.dataset.q); Fx.regen(L); }
        return;
      }
    });

    window.addEventListener("resize", () => { Stage.resize(); Timeline.render(); });
    window.addEventListener("beforeunload", (e) => {
      if (app.layers.length) { Store.autosave(); }
    });

    setInterval(() => { if (app.layers.length) History.maybeBackup(); }, 60000);
    Panels.addGrid();
    setView(isTouch() ? "layers" : "inspect");
    refreshAll();
    Stage.resize();
    requestAnimationFrame(Stage.tick);

    /* restore or welcome */
    let skipWelcome = false;
    try { skipWelcome = localStorage.getItem("geoui.noWelcome") === "1"; } catch (e) {}
    Store.readAutosave().then(auto => restoreOrWelcome(auto, skipWelcome));
    Store.setSaveState("");
    Log.quiet("準備完了");
  }

  function restoreOrWelcome(auto, skipWelcome) {
    if (auto && auto.data && (auto.data.layers || []).length) {
      const when = new Date(auto.at || Date.now());
      Dialog.open({
        title: "前回の続きがあります",
        desc: `${when.toLocaleString("ja-JP")} に自動保存されたプロジェクトが見つかりました。`,
        body: `<p class="help">「${esc((auto.data.meta || {}).name || "無題")}」 · レイヤー ${(auto.data.layers || []).length} 枚<br>
          ${auto.media ? "読み込んだ動画や画像もふくめて、そのまま復元されます。" :
            "素材（読み込んだ動画や画像）は含まれませんが、デザインやエフェクトは復元されます。"}</p>`,
        foot: `<button class="btn" data-close>新しく始める</button>
               <button class="btn primary" data-restore>続きから開く</button>`,
        setup(n, close) {
          n.querySelector("[data-restore]").onclick = async () => {
            close(null);
            const pg = Dialog.progress("復元しています");
            try { await Project.restore(auto.data); Log.ok("前回の続きを復元しました"); } catch (e) { Log.error(e); }
            pg.done();
          };
        }
      });
    } else if (!skipWelcome) {
      setTimeout(welcome, 260);
    }
  }

  return { boot, setView, setTheme, run, welcome, help: helpDialog, handleFile, addOf,
           exportDialog, quickPlace, ACTIONS };
})();

/* ============================================================================
   スマホ：プレビューの高さをドラッグで変える
   ========================================================================== */
function initStageGrip() {
  const g = document.getElementById("stageGrip");
  if (!g) return;
  const KEY = "geoui.stageH";
  const setH = (px) => {
    const vh = Math.max(14, Math.min(74, px / window.innerHeight * 100));
    document.documentElement.style.setProperty("--stage-h", vh.toFixed(1) + "dvh");
    try { localStorage.setItem(KEY, String(vh)); } catch (e) {}
    requestAnimationFrame(() => { Stage.resize(); Timeline.render(); });
  };
  try {
    const s = +localStorage.getItem(KEY);
    if (s > 10) document.documentElement.style.setProperty("--stage-h", s.toFixed(1) + "dvh");
  } catch (e) {}
  let drag = null;
  g.addEventListener("pointerdown", (e) => {
    const box = document.getElementById("stage");
    drag = { y: e.clientY, h: box.getBoundingClientRect().height };
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    g.classList.add("act"); e.preventDefault();
  });
  g.addEventListener("pointermove", (e) => { if (drag) setH(drag.h + (e.clientY - drag.y)); });
  const end = () => { drag = null; g.classList.remove("act"); };
  g.addEventListener("pointerup", end);
  g.addEventListener("pointercancel", end);
  let last = 0;
  g.addEventListener("click", () => {
    const t = Date.now();
    if (t - last < 320) {
      const cur = getComputedStyle(document.documentElement).getPropertyValue("--stage-h").trim();
      setH(window.innerHeight * (parseFloat(cur) > 50 ? .34 : .66));
    }
    last = t;
  });
}

/* ============================================================================
   モデル → コマ送り画像（ベイク）
   立体のまま焼くので、モデルを使えない場面でも同じ見た目を出せる。
   ========================================================================== */
function bakeModelDialog(L) {
  const m = Model3D.of(L);
  if (!m) { Log.warn("先にモデルを読み込んでください"); return; }
  const anims = (L.model.animList || []);
  const st = { frames: 24, size: 256, spin: anims.length ? 0 : 360, fps: 20, useAnim: anims.length > 0 };
  const est = () => {
    const px = st.size * st.size * st.frames;
    return `${st.frames} コマ · ${st.size}px · 目安 ${(px / 1048576 * 0.6).toFixed(1)} MB`;
  };
  Dialog.open({
    title: "画像素材に焼く",
    desc: "いまの見た目のまま、コマ送りの画像にします。モデルを使わないので、どの環境でも同じように出せます。",
    body: `<div class="grid2" id="bkD"></div>
      ${anims.length ? F.sw("__bkAnim", "アニメーションを 1 周ぶん焼く", st.useAnim) : ""}
      <p class="help" id="bkInfo"></p>
      <div style="border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:10px">
        <canvas id="bkPrev" width="320" height="320" style="width:100%;max-width:320px;display:block;margin:0 auto;background:var(--canvas-bg)"></canvas>
      </div>`,
    foot: `<button class="btn" data-close>やめる</button>
           <button class="btn primary" data-ok>焼く</button>`,
    setup(n, close) {
      const paint = () => {
        n.querySelector("#bkD").innerHTML =
          Media.mini("frames", "コマ数", st.frames, 1, 1, 120) +
          Media.mini("size", "1コマの大きさ", st.size, 16, 32, 1024) +
          Media.mini("spin", "1周で回す角度", st.spin, 15, 0, 720) +
          Media.mini("fps", "なめらかさ", st.fps, 1, 1, 60);
        n.querySelector("#bkInfo").textContent = est();
        preview();
      };
      let busy = false;
      const preview = async () => {
        if (busy) return; busy = true;
        try {
          const cv = n.querySelector("#bkPrev");
          const r = await Model3D.bake(L, { frames: 1, size: 320, spin: 0, useAnim: st.useAnim, fps: st.fps });
          const c = cv.getContext("2d");
          c.clearRect(0, 0, cv.width, cv.height);
          c.putImageData(r.frames[0], 0, 0);
        } catch (e) {} finally { busy = false; }
      };
      Media.bindMini(n, st, paint);
      const sw = n.querySelector('[data-sw="__bkAnim"]');
      if (sw) sw.addEventListener("click", () => setTimeout(() => {
        st.useAnim = sw.getAttribute("aria-checked") === "true"; paint();
      }, 0));
      paint();
      n.querySelector("[data-ok]").onclick = async () => {
        close(null);
        const pg = Dialog.progress("モデルを焼いています");
        try {
          const res = await Model3D.bake(L, st);
          const N = newLayer("image", L.name + " (画像)");
          N.fit = L.fit; N.anchor = L.anchor; N.pivot = L.pivot;
          N.x = L.x; N.y = L.y; N.heightPct = L.heightPct; N.widthPct = L.widthPct;
          N.blend = "blend"; N.scene = L.scene;
          Media.setSource(N, res, res.srcW, res.srcH, res.fps);
          addLayer(N);
          pg.done();
          Log.ok(`${res.frames.length} コマの画像素材にしました`);
        } catch (e) { pg.done(); Log.error(e); }
      };
    }
  });
}
document.addEventListener("DOMContentLoaded", App.boot);
